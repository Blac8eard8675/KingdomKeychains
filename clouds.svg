<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#170526"/><stop offset=".55" stop-color="#321044"/><stop offset="1" stop-color="#180522"/></linearGradient>
 <radialGradient id="cloud"><stop stop-color="#d9a6ed"/><stop offset=".38" stop-color="#9a4fc0"/><stop offset=".72" stop-color="#57216f"/><stop offset="1" stop-color="#2b0b42" stop-opacity="0"/></radialGradient>
 <radialGradient id="lit"><stop stop-color="#fff0bd"/><stop offset=".24" stop-color="#ffc16d"/><stop offset=".58" stop-color="#d66a8b"/><stop offset="1" stop-color="#8a3b9e" stop-opacity="0"/></radialGradient>
 <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="24"/></filter>
 <filter id="detail" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1600" height="1200" fill="url(#sky)"/>
<ellipse cx="800" cy="590" rx="700" ry="390" fill="url(#lit)" opacity=".72" filter="url(#soft)"/>
<!-- towering cloud banks -->
<g filter="url(#soft)" opacity=".96" fill="url(#cloud)">
 <ellipse cx="30" cy="90" rx="300" ry="190"/><ellipse cx="250" cy="180" rx="300" ry="220"/><ellipse cx="500" cy="80" rx="260" ry="170"/>
 <ellipse cx="1550" cy="80" rx="330" ry="210"/><ellipse cx="1330" cy="210" rx="330" ry="240"/><ellipse cx="1100" cy="85" rx="250" ry="170"/>
 <ellipse cx="-10" cy="560" rx="310" ry="250"/><ellipse cx="170" cy="760" rx="330" ry="250"/><ellipse cx="80" cy="1010" rx="390" ry="260"/>
 <ellipse cx="1600" cy="530" rx="330" ry="260"/><ellipse cx="1420" cy="770" rx="350" ry="260"/><ellipse cx="1570" cy="1050" rx="400" ry="280"/>
 <ellipse cx="380" cy="1190" rx="420" ry="260"/><ellipse cx="850" cy="1180" rx="440" ry="250"/><ellipse cx="1240" cy="1180" rx="430" ry="260"/>
</g>
<g filter="url(#detail)" fill="url(#cloud)" opacity=".92">
 <circle cx="70" cy="280" r="145"/><circle cx="190" cy="370" r="180"/><circle cx="340" cy="260" r="155"/><circle cx="480" cy="170" r="130"/>
 <circle cx="1510" cy="300" r="170"/><circle cx="1370" cy="390" r="190"/><circle cx="1220" cy="260" r="150"/><circle cx="1090" cy="160" r="130"/>
 <circle cx="55" cy="720" r="170"/><circle cx="210" cy="850" r="190"/><circle cx="365" cy="970" r="165"/>
 <circle cx="1540" cy="710" r="185"/><circle cx="1380" cy="850" r="190"/><circle cx="1220" cy="990" r="175"/>
 <circle cx="540" cy="1130" r="180"/><circle cx="800" cy="1080" r="190"/><circle cx="1070" cy="1140" r="180"/>
</g>
<!-- gold-lit cloud rims -->
<g fill="url(#lit)" filter="url(#detail)" opacity=".9">
 <ellipse cx="115" cy="145" rx="260" ry="90"/><ellipse cx="360" cy="210" rx="240" ry="75"/><ellipse cx="1460" cy="150" rx="270" ry="95"/>
 <ellipse cx="130" cy="650" rx="250" ry="90"/><ellipse cx="1470" cy="650" rx="270" ry="100"/>
 <ellipse cx="420" cy="1080" rx="330" ry="110"/><ellipse cx="1130" cy="1090" rx="340" ry="115"/>
</g>
<g fill="none" stroke="#e7a8ff" stroke-width="20" opacity=".12" filter="url(#soft)">
 <path d="M-80 390 C130 170 250 540 470 300 S820 160 1010 350 S1370 170 1680 370"/>
 <path d="M-100 900 C160 650 340 1030 580 820 S950 650 1180 850 S1470 670 1700 900"/>
</g>
</svg>